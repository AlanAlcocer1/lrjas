# Coolify — solo backend + PostgreSQL.
# Frontend: Cloudflare Pages (VITE_API_URL=https://api.lrjas.onema.tech/api).
#
# En Coolify:
# - Compose file: docker-compose.coolify.yml
# - Base directory: / (raíz del repo)
# - Dominio público solo en el servicio "backend" → puerto 3001
# - postgres queda privado (sin ports al host)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lrjas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lrjas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lrjas} -d ${POSTGRES_DB:-lrjas}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lrjas

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lrjas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lrjas}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-3001}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL (URL del front en Cloudflare, sin barra final)}
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      ANNIVERSARY_MODERATION_PASSWORD: ${ANNIVERSARY_MODERATION_PASSWORD:-Alan2908}
      MASTER_USER_USERNAME: ${MASTER_USER_USERNAME:-alan}
      MASTER_USER_NAME: ${MASTER_USER_NAME:-Alan}
      MASTER_USER_PASSWORD: ${MASTER_USER_PASSWORD:?Define MASTER_USER_PASSWORD}
      # 1 = no ejecutar prisma db seed (recomendado tras restaurar pg_dump)
      SKIP_DB_SEED: ${SKIP_DB_SEED:-0}
      # Cloudflare R2 (mismas vars que blog eca 360)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PREFIX: ${R2_PREFIX:-}
      WEBP_QUALITY: ${WEBP_QUALITY:-85}
      # WalletWallet (pases Apple/Google en Mi credencial)
      WALLETWALLET_API_KEY: ${WALLETWALLET_API_KEY:-}
      # Opcional (Pro): solo HTTPS. Si vacío, embebe assets/wallet/*.png del backend
      WALLET_PASS_LOGO_URL: ${WALLET_PASS_LOGO_URL:-}
      WALLET_PASS_WIDE_LOGO_URL: ${WALLET_PASS_WIDE_LOGO_URL:-}
      WALLET_PASS_ICON_URL: ${WALLET_PASS_ICON_URL:-}
      # Participa Ya → servicio wasap (misma red Docker)
      WASAP_URL: ${WASAP_URL:-http://wasap:3100}
      WASAP_INTERNAL_TOKEN: ${WASAP_INTERNAL_TOKEN:-}
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lrjas

  wasap:
    build:
      context: ./wasap
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3100
      WASAP_INTERNAL_TOKEN: ${WASAP_INTERNAL_TOKEN:?Define WASAP_INTERNAL_TOKEN}
      CHROME_PATH: /usr/bin/chromium
      WWEBJS_AUTH_PATH: /data/wwebjs_auth
    volumes:
      - wasap_auth:/data
    expose:
      - '3100'
    networks:
      - lrjas

volumes:
  postgres_data:
  wasap_auth:

networks:
  lrjas:
    driver: bridge
