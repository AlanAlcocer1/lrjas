services:
  postgres:
    image: postgres:16-alpine
    container_name: lrjas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lrjas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-lrjas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lrjas} -d ${POSTGRES_DB:-lrjas}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lrjas

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lrjas-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lrjas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lrjas}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      ACTIVIDADES_PUBLIC_URL: ${ACTIVIDADES_PUBLIC_URL:-https://actividades.lrjasmerida.me}
      ACTIVIDADES_ADMIN_CODES: ${ACTIVIDADES_ADMIN_CODES:-}
      MASTER_USER_USERNAME: ${MASTER_USER_USERNAME:-alan}
      MASTER_USER_NAME: ${MASTER_USER_NAME:-Alan}
      MASTER_USER_PASSWORD: ${MASTER_USER_PASSWORD:?Define MASTER_USER_PASSWORD en .env}
      WALLETWALLET_API_KEY: ${WALLETWALLET_API_KEY:-}
      WALLET_PASS_LOGO_URL: ${WALLET_PASS_LOGO_URL:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PREFIX: ${R2_PREFIX:-}
      WEBP_QUALITY: ${WEBP_QUALITY:-85}
      # Hostname = container_name. Si usas Coolify, mira docker-compose.coolify.yml (http://wasap:3100).
      WASAP_URL: ${WASAP_URL:-http://lrjas-wasap:3100}
      WASAP_INTERNAL_TOKEN: ${WASAP_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lrjas

  wasap:
    build:
      context: ./wasap
      dockerfile: Dockerfile
    container_name: lrjas-wasap
    restart: unless-stopped
    environment:
      PORT: 3100
      WASAP_INTERNAL_TOKEN: ${WASAP_INTERNAL_TOKEN:?Define WASAP_INTERNAL_TOKEN en .env}
      # Canal hardcodeado en wasap; opcional override:
      # CHANNEL_ID: ${WASAP_CHANNEL_ID:-}
      CHROME_PATH: /usr/bin/chromium
      WWEBJS_AUTH_PATH: /data/wwebjs_auth
    volumes:
      - wasap_auth:/data
    networks:
      - lrjas

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /
        VITE_ACTIVIDADES_URL: ${ACTIVIDADES_PUBLIC_URL:-https://actividades.lrjasmerida.me}
    container_name: lrjas-web
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - backend
    networks:
      - lrjas

  web-actividades:
    build:
      context: ./frontend-actividades
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /
        VITE_PUBLIC_API_URL: ${FRONTEND_URL:-https://lrjasmerida.me}/api
    container_name: lrjas-web-actividades
    restart: unless-stopped
    ports:
      - '${ACTIVIDADES_HTTP_PORT:-8081}:80'
    depends_on:
      - backend
    networks:
      - lrjas

volumes:
  postgres_data:
  wasap_auth:

networks:
  lrjas:
    driver: bridge
